<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #dfe6e6;
    --ink-dim: #8fa3a6;
    --bg-1: #0e1517;
    --bg-2: #162326;
    --ember: #7fa8a3;
    --ember-soft: #4d6b6c;
    --line: rgba(223,230,230,0.12);
  }

  *{ box-sizing: border-box; }

  html{
    scroll-behavior: smooth;
  }

  html, body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-2), var(--bg-1) 70%);
    background-attachment: fixed;
    color: var(--ink);
    font-family:'Tajawal', sans-serif;
  }

  /* ---------- particles / ember dust ---------- */
  #dust{
    position:fixed; inset:0; pointer-events:none; z-index:1;
  }
  .mote{
    position:absolute; bottom:-10px;
    width:3px; height:3px; border-radius:50%;
    background: var(--ember);
    opacity:0.55;
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.6; }
    90%{ opacity:0.3; }
    100%{ transform: translateY(-110vh) translateX(var(--drift,20px)); opacity:0; }
  }

  /* ---------- loading screen ---------- */
  #loader{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px;
    background: var(--bg-1);
    transition: opacity 1.1s ease, visibility 1.1s ease;
  }
  #loader.hide{ opacity:0; visibility:hidden; }

  .seal{
    width:64px; height:64px; border-radius:50%;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .seal::before{
    content:"";
    position:absolute; inset:-14px;
    border-radius:50%;
    border:1px solid var(--ember-soft);
    opacity:0.5;
    animation: pulse 2.6s ease-in-out infinite;
  }
  .seal svg{ width:22px; height:22px; }
  @keyframes pulse{
    0%,100%{ transform: scale(0.9); opacity:0.15; }
    50%{ transform: scale(1.15); opacity:0.55; }
  }

  #loader-label{
    font-size:13px;
    letter-spacing:0.12em;
    color: var(--ink-dim);
    min-height:18px;
  }

  #loader-bar-track{
    width:180px; height:1px;
    background: var(--line);
    position:relative;
    overflow:hidden;
  }
  #loader-bar-fill{
    position:absolute; inset:0 auto 0 0;
    width:0%;
    background: var(--ember);
    transition: width 0.3s ease;
  }

  /* ---------- letter screen ---------- */
  #stage{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 10vh 6vw 14vh;
  }

  #top-btn{
    position:fixed;
    left:24px; bottom:24px;
    z-index:5;
    width:42px; height:42px;
    border-radius:50%;
    border:1px solid var(--line);
    background: rgba(22,35,38,0.7);
    backdrop-filter: blur(4px);
    color: var(--ink-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.4s ease, color 0.3s ease, border-color 0.3s ease;
  }
  #top-btn.visible{ opacity:1; pointer-events:auto; }
  #top-btn:hover{ color: var(--ink); border-color: var(--ember-soft); }
  #top-btn svg{ width:16px; height:16px; }

  #letter{
    max-width: 640px;
    width:100%;
    opacity:0;
    transition: opacity 1.4s ease;
  }
  #letter.show{ opacity:1; }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.18em;
    color: var(--ember);
    margin-bottom:18px;
    opacity:0.85;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before, .eyebrow::after{
    content:"";
    flex:1; height:1px;
    background: linear-gradient(to var(--fade-dir,left), transparent, var(--line));
  }
  .eyebrow::after{ --fade-dir: right; }

  #salutation{
    font-family:'Aref Ruqaa', serif;
    font-size: clamp(26px, 4vw, 38px);
    color: var(--ink);
    margin: 0 0 26px 0;
    font-weight:700;
  }

  #body-text{
    font-family:'Aref Ruqaa', serif;
    font-size: clamp(19px, 2.6vw, 25px);
    line-height:2.15;
    color: var(--ink);
    white-space: pre-wrap;
    min-height: 260px;
  }

  .cursor{
    display:inline-block;
    width:2px; height:1em;
    background: var(--ember);
    margin-right:2px;
    vertical-align:-0.15em;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  #sign-off{
    margin-top:34px;
    font-size:16px;
    color: var(--ink-dim);
    opacity:0;
    transition: opacity 1.2s ease 0.4s;
  }
  #sign-off.show{ opacity:1; }
  #sign-off .name{
    display:block;
    font-family:'Aref Ruqaa', serif;
    font-size:22px;
    color: var(--ink);
    margin-top:8px;
  }

  @media (max-width: 480px){
    #body-text{ min-height: 320px; }
  }

  @media (prefers-reduced-motion: reduce){
    .mote, .seal::before, .cursor{ animation: none !important; }
    #letter{ transition: none; }
  }
</style>
</head>
<body>

<div id="dust"></div>

<div id="loader">
  <div class="seal">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--ember)" stroke-width="1.2">
      <path d="M12 21s-7.5-4.8-9.8-9.4C.6 8 2.3 4.5 5.8 4.1c2-.2 3.6.9 4.6 2.4C11.4 5 13 3.9 15 4.1c3.5.4 5.2 3.9 3.6 7.5C16.3 16.2 12 21 12 21z"/>
    </svg>
  </div>
  <div id="loader-label">البعد سهل؟</div>
  <div id="loader-bar-track"><div id="loader-bar-fill"></div></div>
</div>

<div id="stage">
  <div id="letter">
    <div class="eyebrow">بنقدر؟</div>
    <h1 id="salutation">ما عندي جواب</h1>
    <div id="body-text"></div>
    <div id="sign-off"><span class="name">حبيبك بدر</span></div>
  </div>
</div>

<button id="top-btn" title="اطلعي لفوق" aria-label="اطلعي لفوق">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>
  </svg>
</button>

<script>
/* ============================================================
   للتعديل: بدّلي النص التالي برسالتك الخاصة قبل الإرسال.
   يمكنك أيضاً تغيير العنوان في #salutation والتوقيع في #sign-off
   ============================================================ */
const MESSAGE = `اسلام كنتي احلى ذكرى

امبارح انا جد كان بدي نبعد
لكن قعدت مع حالي شوي وصفنت
وحكيت بيني وبين حالي
ثلاث سنين من الذكرايات والحب والمواقف

خفت تتأذي او يصيرلك اشي بسببي
حكينا ممكن يقل ومكانتك بقلبي ما حتكون متل اول

ما بعرف اذا بهمك او اذا الي مكانة عندك
لكن تصرفاتك بتدل على العكس
وانو ما في حب لـ بدر

على كل حال
خلي هاذ الموقع عندك
رح اكتب فيه كثير وكثير

انا تعبان

حبيبك بدر`;

/* -------- scroll up anytime -------- */
const topBtn = document.getElementById('top-btn');
topBtn.addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));
window.addEventListener('scroll', ()=>{
  topBtn.classList.toggle('visible', window.scrollY > 120);
});

/* -------- ember dust particles -------- */
const dustLayer = document.getElementById('dust');
const MOTE_COUNT = 26;
for(let i=0;i<MOTE_COUNT;i++){
  const m = document.createElement('div');
  m.className = 'mote';
  const left = Math.random()*100;
  const dur = 9 + Math.random()*10;
  const delay = Math.random()*12;
  const drift = (Math.random()*60 - 30) + 'px';
  m.style.left = left+'vw';
  m.style.animationDuration = dur+'s';
  m.style.animationDelay = '-'+delay+'s';
  m.style.setProperty('--drift', drift);
  dustLayer.appendChild(m);
}

/* -------- loading sequence -------- */
const loader = document.getElementById('loader');
const loaderLabel = document.getElementById('loader-label');
const loaderFill = document.getElementById('loader-bar-fill');
const letterEl = document.getElementById('letter');
const bodyEl = document.getElementById('body-text');
const signOff = document.getElementById('sign-off');

const phases = [
  'جاري تحضير الرسالة…',
  'أبحث عن الكلمات المناسبة…',
  'أعيد ترتيب ما في القلب…',
  'جاهزة تقريباً…'
];

let progress = 0;
let phaseIdx = 0;
loaderLabel.textContent = phases[0];

const progressTimer = setInterval(()=>{
  progress += Math.random()*9 + 4;
  if(progress >= 100){
    progress = 100;
    clearInterval(progressTimer);
    setTimeout(startLetter, 500);
  }
  loaderFill.style.width = progress + '%';
  const newPhase = Math.min(phases.length-1, Math.floor(progress/100*phases.length));
  if(newPhase !== phaseIdx){
    phaseIdx = newPhase;
    loaderLabel.textContent = phases[phaseIdx];
  }
}, 260);

function startLetter(){
  loader.classList.add('hide');
  setTimeout(()=>{
    letterEl.classList.add('show');
    typeMessage();
  }, 500);
}

/* -------- real-time typing effect -------- */
function typeMessage(){
  const cursor = document.createElement('span');
  cursor.className = 'cursor';

  let i = 0;
  const total = MESSAGE.length;

  function tick(){
    if(i < total){
      const ch = MESSAGE[i];
      bodyEl.textContent = MESSAGE.slice(0, i+1);
      bodyEl.appendChild(cursor);
      i++;
      // human-like variable pacing: pause longer after punctuation
      let delay = 32 + Math.random()*38;
      if(/[،.\n]/.test(ch)) delay += 260;
      if(ch === '\n') delay += 200;
      setTimeout(tick, delay);
    } else {
      setTimeout(()=>{
        signOff.classList.add('show');
      }, 500);
    }
  }
  tick();
}
</script>

</body>
</html>
